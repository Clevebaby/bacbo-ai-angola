name: BAC BO AI PRO

on:
workflow_dispatch:
push:
branches:
- main

jobs:
run-bot:
runs-on: ubuntu-latest

steps:
  - name: Baixar código
    uses: actions/checkout@v4

  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Instalar bibliotecas
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Verificar configuração
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |
      python -c "import os; print('TELEGRAM_BOT_TOKEN:', 'OK' if os.getenv('TELEGRAM_BOT_TOKEN') else 'FALTA')"
      python -c "import os; print('GEMINI_API_KEY:', 'OK' if os.getenv('GEMINI_API_KEY') else 'FALTA')"

  - name: Iniciar Bot
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python bot.py
